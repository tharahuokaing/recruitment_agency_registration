<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Huokaing Thara Recruitment Agency</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-icon">
                <img src="recruitment_logo.jpg" alt="Huokaing Thara Recruitment" onerror="this.src='https://via.placeholder.com/44?text=HT'">
            </div>
            <div class="logo-text">
                <h1 data-km="ភ្នាក់ងារជ្រើសរើសពលករ ហួកាំងថារ៉ា" data-en="Huokaing Thara Recruitment Agency">ភ្នាក់ងារជ្រើសរើសពលករ ហួកាំងថារ៉ា</h1>
                <span data-km="ប្រព័ន្ធចុះឈ្មោះគណនីថ្មី" data-en="New User Registration Portal">ប្រព័ន្ធចុះឈ្មោះគណនីថ្មី</span>
            </div>
        </div>

        <div class="header-actions">
            <!-- Language Switcher -->
            <button id="lang-toggle" class="btn btn-lang">
                🌐 <span id="lang-text">English</span>
            </button>
            
            <!-- Registration Trigger Button -->
            <button id="open-register-btn" class="btn btn-gold">
                📝 <span data-km="ចុះឈ្មោះ" data-en="Register">ចុះឈ្មោះ</span>
            </button>
        </div>
    </header>

    <!-- Main Welcome Screen -->
    <main class="hero-container">
        <h2 data-km="បង្កើតគណនីថ្មីជាមួយ ហួកាំងថារ៉ា" data-en="Create a New Account with Huokaing Thara">បង្កើតគណនីថ្មីជាមួយ ហួកាំងថារ៉ា</h2>
        <p data-km="ចុះឈ្មោះឥឡូវនេះដើម្បីដាក់ពាក្យធ្វើការ ផ្ញើប្រវត្តិរូបសង្ខេប (CV) ឬជ្រើសរើសបុគ្គលិកសម្រាប់ក្រុមហ៊ុនរបស់អ្នក" data-en="Register now to apply for open roles, submit your resume, or post vacancies for your enterprise.">ចុះឈ្មោះឥឡូវនេះដើម្បីដាក់ពាក្យធ្វើការ ផ្ញើប្រវត្តិរូបសង្ខេប (CV) ឬជ្រើសរើសបុគ្គលិកសម្រាប់ក្រុមហ៊ុនរបស់អ្នក</p>
        <button id="hero-register-btn" class="btn btn-gold btn-lg">
            📝 <span data-km="ចុះឈ្មោះគណនីថ្មីឥឡូវនេះ" data-en="Register New Account Now">ចុះឈ្មោះគណនីថ្មីឥឡូវនេះ</span>
        </button>
    </main>

    <!-- Interactive Registration Modal Overlay -->
    <div id="register-modal" class="modal-overlay">
        <div class="modal-card">
            <button id="close-register-btn" class="modal-close">&times;</button>
            
            <div class="modal-header">
                <h3 data-km="ចុះឈ្មោះគណនីថ្មី" data-en="Create Your Account">ចុះឈ្មោះគណនីថ្មី</h3>
                <p data-km="សូមបំពេញព័ត៌មានខាងក្រោមដើម្បីបង្កើតគណនី" data-en="Please fill in the details below to complete registration">សូមបំពេញព័ត៌មានខាងក្រោមដើម្បីបង្កើតគណនី</p>
            </div>

            <!-- Registration Form -->
            <form id="register-form">
                <div class="form-group">
                    <label data-km="ប្រភេទអ្នកប្រើប្រាស់" data-en="Account Type">ប្រភេទអ្នកប្រើប្រាស់</label>
                    <select id="reg-type" required>
                        <option value="candidate" data-km="បេក្ខជនស្វែងរកការងារ" data-en="Job Seeker / Candidate">បេក្ខជនស្វែងរកការងារ</option>
                        <option value="employer" data-km="ក្រុមហ៊ុន / និយោជក" data-en="Employer / Enterprise">ក្រុមហ៊ុន / និយោជក</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-km="ឈ្មោះពេញ" data-en="Full Name">ឈ្មោះពេញ</label>
                    <input type="text" id="reg-fullname" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label data-km="លេខទូរស័ព្ទ ឬ Telegram" data-en="Phone Number or Telegram">លេខទូរស័ព្ទ ឬ Telegram</label>
                    <input type="tel" id="reg-phone" required placeholder="012 345 678">
                </div>

                <div class="form-group">
                    <label data-km="អ៊ីមែល" data-en="Email Address">អ៊ីមែល</label>
                    <input type="email" id="reg-email" required placeholder="user@example.com">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label data-km="ពាក្យសម្ងាត់" data-en="Password">ពាក្យសម្ងាត់</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-password" required placeholder="••••••••">
                            <button type="button" id="toggle-reg-pass" class="toggle-pwd-btn">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label data-km="បញ្ជាក់ពាក្យសម្ងាត់" data-en="Confirm Password">បញ្ជាក់ពាក្យសម្ងាត់</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-confirm-password" required placeholder="••••••••">
                            <button type="button" id="toggle-confirm-pass" class="toggle-pwd-btn">👁️</button>
                        </div>
                    </div>
                </div>

                <div class="form-options">
                    <label class="terms-label">
                        <input type="checkbox" id="agree-terms" required>
                        <span data-km="ខ្ញុំយល់ព្រមតាមលក្ខខណ្ឌ និងគោលការណ៍" data-en="I agree to Terms & Conditions">ខ្ញុំយល់ព្រមតាមលក្ខខណ្ឌ និងគោលការណ៍</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-gold btn-full" id="finish-btn">
                    <span data-km="បញ្ចប់ការចុះឈ្មោះ (Finish)" data-en="Finish Registration">បញ្ចប់ការចុះឈ្មោះ (Finish)</span>
                </button>
            </form>

            <div class="modal-footer">
                <span data-km="មានគណនីរួចហើយមែនទេ?" data-en="Already have an account?">មានគណនីរួចហើយមែនទេ?</span>
                <a href="https://tharahuokaing.github.io/recruitment_agency_login/" class="login-link" data-km="ចូលប្រើប្រាស់ទីនេះ" data-en="Login Here">ចូលប្រើប្រាស់ទីនេះ</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
